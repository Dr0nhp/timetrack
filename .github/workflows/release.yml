name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build signed app
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Generate latest.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"
          BUNDLE="target/release/bundle/macos"
          SIG_FILE="${BUNDLE}/TimeTrack.app.tar.gz.sig"
          echo "Bundle contents:"
          ls -la "${BUNDLE}"
          bash scripts/generate-latest-json.sh "$VERSION" "$TAG" "$SIG_FILE" "TimeTrack.app.tar.gz"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/macos/TimeTrack.app.tar.gz
            target/release/bundle/macos/TimeTrack.app.tar.gz.sig
            target/release/bundle/dmg/TimeTrack_*_aarch64.dmg
            latest.json
