[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/monitor",
    "src-tauri",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
